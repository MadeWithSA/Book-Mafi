<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Mafi — Каталог</title>
<script>try{document.documentElement.setAttribute('data-theme',JSON.parse(localStorage.getItem('bm_theme')||'"dark"'))}catch(e){}</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="catalog">
<main class="page">
  <div class="page-head enter"><h1 data-i18n="cat_title"></h1><p data-i18n="cat_sub"></p></div>
  <div class="toolbar enter" style="animation-delay:.1s">
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" data-i18n-ph="search" autocomplete="off"></div>
    <select class="sel" id="sort" aria-label="sort"></select>
  </div>
  <div class="chips enter" id="chips" style="animation-delay:.2s"></div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</main>
<script src="js/books.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
