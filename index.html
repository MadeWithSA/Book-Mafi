<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Mafi — книжный магазин</title>
<script>try{document.documentElement.setAttribute('data-theme',JSON.parse(localStorage.getItem('bm_theme')||'"dark"'))}catch(e){}</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home" class="home">
<div class="progress"></div>
<video id="src" muted playsinline preload="auto" style="display:none"><source src="media/video_smooth.mp4" type="video/mp4"><source src="media/video.mp4" type="video/mp4"></video>

<main class="scroll-track">
  <div class="stage">
    <canvas id="scene-canvas"></canvas>

    <!-- резкие склейки -->
    <div class="scene s1" data-at="0.455"><div class="bg"></div></div>
    <div class="scene s2" data-at="0.615"><div class="bg"></div><div class="hearts"></div></div>
    <div class="scene s3" data-at="0.775"><span class="blind"></span><span class="blind"></span><span class="blind"></span><span class="blind"></span><span class="blind"></span><span class="blind"></span><span class="blind"></span><span class="blind"></span><svg class="route" viewBox="0 0 1000 600" preserveAspectRatio="none"><path d="M-20 480 C200 380 260 560 480 420 S760 240 1020 330" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg><div class="truck">🚚</div></div>
    <div class="scene s4" data-at="0.915"><div class="bg"></div></div>
    <div class="flash"></div>

    <div class="hero-intro">
      <span class="kick" data-i18n="hero_kicker"></span>
      <h1 data-i18n="hero_title"></h1>
      <p data-i18n="hero_text"></p>
    </div>
    <div class="hint"><i></i><span data-i18n="scroll_hint"></span></div>

    <div class="panel L" data-from="0.07" data-to="0.19">
      <span class="k" data-i18n="s1_k"></span>
      <h2 data-i18n="s1_t"></h2>
      <p data-i18n="s1_p"></p>
    </div>
    <div class="panel R" data-from="0.20" data-to="0.31">
      <span class="k" data-i18n="s2_k"></span>
      <h2 data-i18n="s2_t"></h2>
      <p data-i18n="s2_p"></p>
    </div>
    <div class="panel L" data-from="0.32" data-to="0.44">
      <span class="k" data-i18n="s3_k"></span>
      <h2 data-i18n="s3_t"></h2>
      <p data-i18n="s3_p"></p>
    </div>
    <div class="panel R" data-from="0.47" data-to="0.61">
      <span class="k" data-i18n="c1_k"></span>
      <h2 data-i18n="c1_t"></h2>
      <p data-i18n="c1_p"></p>
    </div>
    <div class="panel L" data-from="0.63" data-to="0.77">
      <span class="k" data-i18n="c2_k"></span>
      <h2 data-i18n="c2_t"></h2>
      <p data-i18n="c2_p"></p>
    </div>
    <div class="panel R" data-from="0.79" data-to="0.91">
      <span class="k" data-i18n="c3_k"></span>
      <h2 data-i18n="c3_t"></h2>
      <p data-i18n="c3_p"></p>
    </div>
    <div class="panel L" data-from="0.925" data-to="1.01">
      <span class="k" data-i18n="c4_k"></span>
      <h2 data-i18n="c4_t"></h2>
      <p data-i18n="c4_p"></p>
      <div class="cta"><a class="btn" href="catalog.html" data-i18n="cta_catalog"></a><a class="btn ghost" href="favorites.html" data-i18n="cta_fav"></a></div>
    </div>
  </div>
</main>

<section class="after-sec">
  <h2 data-i18n="cat_title"></h2>
  <div class="cta" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><a class="btn" href="catalog.html" data-i18n="cta_catalog"></a></div>
</section>
<footer class="foot" style="background:var(--bg)"><b>Book Mafi</b> · <span data-i18n="footer"></span> · 2026</footer>
<script src="js/books.js"></script>
<script src="js/i18n.js"></script>

</html>
